<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Page not found | PureNest</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tailwind (for quick utility, but we use custom vars) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            background: 'var(--color-background)',
            'primary-text': 'var(--color-primary-text)',
            'secondary-text': 'var(--color-secondary-text)',
            accent: 'var(--color-accent)',
            primary: 'var(--color-primary)',
            secondary: 'var(--color-secondary)',
            border: 'var(--color-border)',
            hover: 'var(--color-hover)',
            'card-bg': 'var(--color-card-bg)',
          }
        }
      }
    }
  </script>
  <style>
    /* =========================
       THEME VARIABLES — same as main site
    ========================= */
    :root, html[data-theme='light'] {
      --color-background: #F0FDFA;
      --color-primary-text: #115E59;
      --color-secondary-text: #334155;
      --color-accent: #06B6D4;
      --color-primary: #0D9488;
      --color-secondary: #2DD4BF;
      --color-border: #CCFBF1;
      --color-hover: #E0F2FE;
      --color-card-bg: #FFFFFF;
    }
    html[data-theme='dark'] {
      --color-background: #042F2E;
      --color-primary-text: #F0FDFA;
      --color-secondary-text: #94A3B8;
      --color-accent: #22D3EE;
      --color-primary: #14B8A6;
      --color-secondary: #5EEAD4;
      --color-border: #134E4A;
      --color-hover: #115E59;
      --color-card-bg: #134E4A;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--color-background);
      color: var(--color-primary-text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      transition: background-color 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* decorative bubbles / particles */
    .bubble {
      position: fixed;
      border-radius: 50%;
      background: var(--color-accent);
      opacity: 0.08;
      pointer-events: none;
      z-index: 0;
      animation: floatBubble 14s infinite alternate ease-in-out;
    }
    @keyframes floatBubble {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(20px, -30px) scale(1.1); }
    }

    /* main 404 card */
    .error-card {
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      border-radius: 2.5rem;
      padding: 3rem 2.5rem;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
      position: relative;
      z-index: 10;
      backdrop-filter: blur(2px);
    }
    html[data-theme='dark'] .error-card {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .error-code {
      font-size: 7rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent), var(--color-secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      margin-bottom: 0.5rem;
      text-shadow: 0 8px 20px rgba(13, 148, 136, 0.1);
    }
    @media (max-width: 480px) {
      .error-code {
        font-size: 5rem;
      }
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: white;
      transition: all 0.3s;
      padding: 0.9rem 1.8rem;
      border-radius: 1rem;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 16px -6px rgba(13, 148, 136, 0.3);
    }
    .btn-primary:hover {
      background-color: var(--color-accent);
      box-shadow: 0 12px 24px -8px rgba(6, 182, 212, 0.5);
      transform: translateY(-2px);
    }

    .btn-accent {
      background-color: transparent;
      color: var(--color-primary);
      border: 2px solid var(--color-primary);
      transition: all 0.3s;
      padding: 0.9rem 1.8rem;
      border-radius: 1rem;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-accent:hover {
      background-color: var(--color-primary);
      color: white;
      box-shadow: 0 12px 24px -8px rgba(13, 148, 136, 0.4);
      transform: translateY(-2px);
    }

    .icon-btn {
      background: var(--color-hover);
      border: 1px solid var(--color-border);
      color: var(--color-primary-text);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      cursor: pointer;
      font-size: 1.1rem;
      backdrop-filter: blur(4px);
    }
    .icon-btn:hover {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
      transform: scale(1.05);
    }

    /* floating controls - top right */
    .controls {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      gap: 0.75rem;
      z-index: 100;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    html[dir='rtl'] .controls {
      right: auto;
      left: 1.5rem;
      flex-direction: row-reverse;
    }

    /* small helpers */
    .text-secondary {
      color: var(--color-secondary-text);
    }
    .text-primary {
      color: var(--color-primary);
    }
    .text-accent {
      color: var(--color-accent);
    }
    .gradient-text {
      background: linear-gradient(90deg, var(--color-primary), var(--color-accent), var(--color-secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    /* link hover */
    .home-link {
      color: var(--color-primary);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 2px dotted var(--color-accent);
      transition: 0.2s;
    }
    .home-link:hover {
      color: var(--color-accent);
      border-bottom-color: var(--color-primary);
    }

    /* responsive */
    @media (max-width: 640px) {
      .error-card {
        padding: 2rem 1.5rem;
      }
      .controls {
        top: 0.8rem;
        right: 0.8rem;
      }
      html[dir='rtl'] .controls {
        left: 0.8rem;
        right: auto;
      }
    }

    /* subtle grid pattern */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(var(--color-border) 1px, transparent 1px),
                        linear-gradient(90deg, var(--color-border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.15;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <!-- background grid + bubbles (decorative) -->
  <div class="bg-grid"></div>
  <div class="bubble" style="width: 300px; height: 300px; top: 10%; left: -5%;"></div>
  <div class="bubble" style="width: 500px; height: 500px; bottom: -10%; right: -5%; animation-duration: 22s; opacity: 0.05;"></div>
  <div class="bubble" style="width: 150px; height: 150px; top: 40%; right: 15%; animation-duration: 18s; opacity: 0.07;"></div>

  <!-- floating theme + rtl controls (no header/footer) -->
  <div class="controls">
    <!-- Theme toggle button -->
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle theme">
      <svg class="w-6 h-6 light-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
      <svg class="w-6 h-6 dark-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
    </button>
    <!-- RTL / LTR toggle -->
    <button id="lang-toggle" class="icon-btn" aria-label="Toggle RTL/LTR" title="Switch direction">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
      </svg>
    </button>
  </div>

  <!-- 404 card (no header/footer) -->
  <main class="error-card">
    <div class="text-center">
      <!-- icon area -->
      <div class="flex justify-center mb-4">
        <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-primary to-accent flex items-center justify-center text-white text-4xl shadow-xl">
          <i class="fa-solid fa-pump-soap"></i>
        </div>
      </div>

      <!-- big 404 -->
      <div class="error-code">404</div>

      <!-- heading -->
      <h1 class="text-2xl sm:text-3xl font-semibold text-primary-text mb-3">
        This page is <span class="gradient-text">spotless</span> — but empty.
      </h1>

      <!-- description -->
      <p class="text-base text-secondary leading-relaxed max-w-md mx-auto mb-8">
        The page you're looking for has been moved, removed, or never existed. 
        Let's get you back to a clean, working space.
      </p>

      <!-- action buttons -->
      <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
        <a href="index.html" class="btn-primary w-full sm:w-auto">
          <i class="fa-solid fa-house"></i> Back to Home
        </a>
        <a href="services.html" class="btn-accent w-full sm:w-auto">
          <i class="fa-solid fa-broom"></i> Browse Services
        </a>
      </div>

      <!-- small hint / decorative divider -->
      <div class="mt-8 pt-6 border-t border-border text-xs text-secondary flex items-center justify-center gap-2">
        <i class="fa-solid fa-circle-check text-primary"></i>
        <span>PureNest · Professional cleaning, spotless results.</span>
      </div>
    </div>
  </main>

  <!-- script: theme + rtl + active states (no header/footer elements) -->
  <script>
    (function() {
      const html = document.documentElement;

      // ----- THEME -----
      const themeToggle = document.getElementById('theme-toggle');
      const lightIcons = document.querySelectorAll('.light-icon');
      const darkIcons = document.querySelectorAll('.dark-icon');

      function applyTheme(theme) {
        html.setAttribute('data-theme', theme);
        lightIcons.forEach(i => i.classList.toggle('hidden', theme === 'dark'));
        darkIcons.forEach(i => i.classList.toggle('hidden', theme === 'light'));
        localStorage.setItem('theme', theme);
      }

      function initTheme() {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored === 'dark' || (!stored && prefersDark) ? 'dark' : 'light';
        applyTheme(theme);
      }

      themeToggle.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        applyTheme(current === 'light' ? 'dark' : 'light');
      });

      initTheme();

      // ----- RTL / LTR -----
      const langToggle = document.getElementById('lang-toggle');
      
      function applyDirection(dir) {
        html.setAttribute('dir', dir);
        localStorage.setItem('language', dir === 'rtl' ? 'ar' : 'en');
      }

      function initDirection() {
        const storedLang = localStorage.getItem('language');
        const dir = storedLang === 'ar' ? 'rtl' : 'ltr';
        html.setAttribute('dir', dir);
      }

      langToggle.addEventListener('click', () => {
        const currentDir = html.getAttribute('dir');
        const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
        applyDirection(newDir);
      });

      initDirection();

      // ----- tiny active link highlight (no nav links here, but just in case) -----
      // (optional: not needed but consistent)
    })();
  </script>
</body>
</html>
